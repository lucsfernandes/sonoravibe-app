name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/**'
      - 'k8s/worker/**'
      - 'k8s/base/**'
      - '.github/workflows/deploy-worker.yml'
      - 'pnpm-lock.yaml'
      - '.swcrc'
  workflow_dispatch:

concurrency:
  group: deploy-sonora-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      # Esta imagem carrega PyTorch e os pesos do Demucs: o primeiro build passa
      # de 10 minutos. O timeout maior evita que ele seja cortado no meio.
      - name: Build and push Docker image
        timeout-minutes: 45
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/sonora-worker:${{ github.sha }}
          docker build -f apps/worker/Dockerfile -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Prepare kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Criar namespace se não existir
        run: kubectl get namespace sonora || kubectl create namespace sonora

      - name: Criar/atualizar secret no cluster
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          # Família SFT (v2.0 e v2.5). Vazio = essas versões falham e estornam.
          RUNPOD_ENDPOINT_ID_SFT: ${{ secrets.RUNPOD_ENDPOINT_ID_SFT }}
          # Capas (FLUX.2 klein). Vazio = as capas saem do OpenRouter, como antes.
          RUNPOD_ENDPOINT_ID_IMAGE: ${{ secrets.RUNPOD_ENDPOINT_ID_IMAGE }}
        run: |
          kubectl create secret generic sonora-worker-secret -n sonora \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
            --from-literal=R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            --from-literal=R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            --from-literal=R2_BUCKET="$R2_BUCKET" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --from-literal=RUNPOD_API_KEY="$RUNPOD_API_KEY" \
            --from-literal=RUNPOD_ENDPOINT_ID="$RUNPOD_ENDPOINT_ID" \
            --from-literal=RUNPOD_ENDPOINT_ID_SFT="$RUNPOD_ENDPOINT_ID_SFT" \
            --from-literal=RUNPOD_ENDPOINT_ID_IMAGE="$RUNPOD_ENDPOINT_ID_IMAGE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Replace image placeholder
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/sonora-worker:${{ github.sha }}
          sed -i "s|REPLACE_IMAGE|${IMAGE_NAME}|g" k8s/worker/deployment.yaml

      - name: kubectl apply
        run: kubectl apply -k k8s/worker

      # 600s: a estratégia é Recreate e o pod antigo espera até 15 min para
      # terminar os jobs ativos antes de sair.
      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/sonora-worker -n sonora --timeout=600s \
            || { kubectl describe pods -n sonora -l app.kubernetes.io/name=sonora-worker | tail -n 60; exit 1; }
