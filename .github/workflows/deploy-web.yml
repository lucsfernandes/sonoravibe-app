name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'k8s/web/**'
      - 'k8s/base/**'
      - '.github/workflows/deploy-web.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-sonora-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/sonora-web:${{ github.sha }}
          # NEXT_PUBLIC_* é fixada no bundle durante o build — precisa vir aqui,
          # como build-arg. No ConfigMap não teria efeito algum.
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.sonoravibe.com \
            -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Prepare kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Criar namespace se não existir
        run: kubectl get namespace sonora || kubectl create namespace sonora

      # O Deployment referencia sonora-web-secret com secretRef; sem o objeto
      # existir, o pod fica em CreateContainerConfigError. Ele nasce vazio de
      # propósito: hoje o frontend não tem nenhum segredo de runtime.
      - name: Garantir o secret (vazio)
        run: |
          kubectl create secret generic sonora-web-secret -n sonora \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Replace image placeholder
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/sonora-web:${{ github.sha }}
          sed -i "s|REPLACE_IMAGE|${IMAGE_NAME}|g" k8s/web/deployment.yaml

      - name: kubectl apply
        run: kubectl apply -k k8s/web

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/sonora-web -n sonora --timeout=300s \
            || { kubectl describe pods -n sonora -l app.kubernetes.io/name=sonora-web | tail -n 60; exit 1; }
