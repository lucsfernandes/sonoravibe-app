name: Deploy API

on:
  push:
    branches: [main]
    # Filtro de caminho: mexer só no frontend não redeploya a API. Sem isto,
    # todo push reiniciaria as três aplicações — incluindo o worker, que pode
    # estar no meio de uma geração.
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'k8s/api/**'
      - 'k8s/base/**'
      - '.github/workflows/deploy-api.yml'
      - 'pnpm-lock.yaml'
      - '.swcrc'
  workflow_dispatch: # permite redeploy manual sem commit vazio

concurrency:
  group: deploy-sonora-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/sonora-api:${{ github.sha }}
          # Contexto na raiz: o pnpm precisa do lockfile e dos pacotes internos.
          docker build -f apps/api/Dockerfile -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Prepare kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Criar namespace se não existir
        run: kubectl get namespace sonora || kubectl create namespace sonora

      - name: Criar/atualizar secret no cluster
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
        run: |
          kubectl create secret generic sonora-api-secret -n sonora \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            --from-literal=R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
            --from-literal=R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            --from-literal=R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            --from-literal=R2_BUCKET="$R2_BUCKET" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --from-literal=RUNPOD_API_KEY="$RUNPOD_API_KEY" \
            --from-literal=RUNPOD_ENDPOINT_ID="$RUNPOD_ENDPOINT_ID" \
            --from-literal=ASAAS_API_KEY="$ASAAS_API_KEY" \
            --from-literal=ASAAS_WEBHOOK_TOKEN="$ASAAS_WEBHOOK_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # O Redis é do projeto, não da aplicação: aplicá-lo aqui garante que ele
      # exista antes da API subir. É idempotente — se já estiver no ar, nada muda.
      - name: Garantir o Redis
        run: kubectl apply -k k8s/redis

      - name: Replace image placeholder
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/sonora-api:${{ github.sha }}
          sed -i "s|REPLACE_IMAGE|${IMAGE_NAME}|g" k8s/api/deployment.yaml

      - name: kubectl apply
        run: kubectl apply -k k8s/api

      # Sem isto o job fica verde mesmo se o pod novo nunca ficar pronto: o
      # maxUnavailable: 0 mantém o pod antigo servindo e a falha passa batida.
      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/sonora-api -n sonora --timeout=300s \
            || { kubectl describe pods -n sonora -l app.kubernetes.io/name=sonora-api | tail -n 60; exit 1; }
