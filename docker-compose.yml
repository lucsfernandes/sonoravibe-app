# Ambiente de desenvolvimento local.
# Rode de dentro do WSL: docker compose up -d
# Produção usa os manifests em infra/k8s (Postgres e Redis como StatefulSet).

services:
  postgres:
    image: postgres:16-alpine
    container_name: sonora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonora
      POSTGRES_PASSWORD: sonora
      POSTGRES_DB: sonora
    ports:
      # 5432 e 6379 ja sao usadas por outros projetos nesta maquina.
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonora -d sonora']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sonora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Emula o R2 localmente (API compatível com S3), para não gastar o bucket real em dev.
  minio:
    # O Docker Hub passou a exigir login para minio/minio; o espelho no quay.io segue publico.
    image: quay.io/minio/minio:latest
    container_name: sonora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sonora
      MINIO_ROOT_PASSWORD: sonora123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket na primeira subida e libera leitura pública.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sonora sonora123;
      mc mb --ignore-existing local/sonora-audio;
      mc anonymous set download local/sonora-audio;
      echo 'bucket sonora-audio pronto';
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
