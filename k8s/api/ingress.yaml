apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonora-api-ingress
  namespace: sonora
  labels:
    app.kubernetes.io/name: sonora-api
    app.kubernetes.io/part-of: arcobatrox
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Emissor por DNS-01 na Cloudflare, e não o `letsencrypt-prod` (HTTP-01) dos
    # outros projetos: com o proxy da Cloudflare ligado, o desafio HTTP-01 é
    # respondido pela Cloudflare e nunca chega aqui. O porquê completo está em
    # k8s/cert-manager/clusterissuer-cloudflare.yaml.
    #
    # Se preferir deixar o DNS sem proxy (nuvem cinza), o HTTP-01 volta a
    # funcionar e basta trocar por `letsencrypt-prod`.
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    # O Traefik não faz buffer de resposta por padrão, que é o necessário para
    # o SSE de /generations/stream funcionar. Se algum dia um middleware de
    # buffering for adicionado globalmente, o progresso das gerações só chega
    # no fim — e o sintoma é "a barra fica parada e pula para 100%".
    # Redirect HTTP->HTTPS: só habilite depois de conferir se o Traefik já redireciona globalmente.
    # Se precisar, copie assets/optional/middlewares.yaml para k8s/ e descomente:
    # traefik.ingress.kubernetes.io/router.middlewares: sonora-redirect-to-https@kubernetescrd
spec:
  tls:
    - hosts:
        - api.sonoravibe.com
      secretName: sonora-api-tls
  rules:
    - host: api.sonoravibe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonora-api
                port:
                  number: 80
