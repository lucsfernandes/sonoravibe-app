apiVersion: v1
kind: ConfigMap
metadata:
  name: sonora-api-config
  namespace: sonora
  labels:
    app.kubernetes.io/name: sonora-api
    app.kubernetes.io/part-of: arcobatrox
data:
  # Apenas valores NÃO sensíveis. Credenciais e URLs com senha vão em
  # GitHub Secrets -> sonora-api-secret (criado pelo workflow, nunca commitado).
  NODE_ENV: "production"
  API_PORT: "3001"
  TZ: "America/Sao_Paulo"

  # Origens liberadas no CORS. O cookie de sessão viaja entre sonoravibe.com e
  # api.sonoravibe.com; sem esta lista o navegador recusa toda requisição
  # autenticada, e o sintoma é "401 em tudo, mesmo logado".
  CORS_ORIGINS: "https://sonoravibe.com,https://www.sonoravibe.com"

  # Base pública da API: o Better Auth monta as URLs de callback a partir daqui.
  BETTER_AUTH_URL: "https://api.sonoravibe.com"

  # NUNCA "true" em produção: o synchronize do TypeORM apaga coluna que sumiu do
  # código, e aqui isso significaria perder música de usuário. A própria
  # validação de configuração recusa subir com isto ligado em produção.
  DB_SYNCHRONIZE: "false"

  # TEMPORÁRIO — trocar de volta para "acestep" quando o endpoint da RunPod
  # existir. O ACE-Step custa cerca de US$ 0,008 por música e entrega até 8 min;
  # o Lyria custa ~US$ 0,08 (dez vezes mais) e para em ~3 min. A troca está aqui
  # porque a API se recusa a subir com "acestep" sem RUNPOD_ENDPOINT_ID, e o
  # endpoint ainda não foi criado.
  #
  # Com "lyria", os secrets RUNPOD_API_KEY e RUNPOD_ENDPOINT_ID podem nem
  # existir: eles só são exigidos pelo motor ACE-Step.
  MUSIC_PROVIDER: "lyria"
  PAYMENT_PROVIDER: "asaas"

  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  OPENROUTER_TEXT_MODEL: "google/gemini-2.5-flash"
  OPENROUTER_IMAGE_MODEL: "google/gemini-2.5-flash-image"
  OPENROUTER_MUSIC_MODEL: "google/lyria-3-pro-preview"
  OPENROUTER_CLIP_MODEL: "google/lyria-3-clip-preview"
  OPENROUTER_APP_NAME: "Sonora"
  OPENROUTER_SITE_URL: "https://sonoravibe.com"

  # Produção do Asaas. O sandbox é api-sandbox.asaas.com/v3.
  ASAAS_BASE_URL: "https://api.asaas.com/v3"

  R2_PUBLIC_URL: "https://cdn.sonoravibe.com"
