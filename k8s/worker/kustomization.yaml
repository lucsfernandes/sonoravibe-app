apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: arcobatrox

resources:
  # O namespace vive na base para os três componentes compartilharem o mesmo
  # PSA e as mesmas labels, em vez de três cópias que podem divergir.
  - ../base
  - configmap.yaml
  # secret.yaml NÃO existe no repo: o workflow cria o secret a partir dos GitHub Secrets
  - deployment.yaml
  - networkpolicy.yaml
