apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonora-web
  namespace: sonora
  labels:
    app.kubernetes.io/name: sonora-web
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: arcobatrox
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # o pod antigo só sai depois que o novo passar nos probes
  selector:
    matchLabels:
      app.kubernetes.io/name: sonora-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonora-web
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: arcobatrox
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # deve ser o mesmo UID criado no Dockerfile
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # REPLACE_IMAGE é trocado pelo workflow (sed) por <dockerhub-user>/<app>:<git-sha>
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent # seguro porque a tag é o SHA (imutável)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sonora-web-config
            - secretRef:
                name: sonora-web-secret
          resources:
            # O servidor standalone do Next com React 19 estabiliza perto de
            # 150Mi; 256Mi de limite deixaria margem quase zero para picos de SSR.
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          # readOnlyRootFilesystem=true: qualquer caminho que o app escreva precisa de volume.
          # Next.js também precisa de /app/.next/cache (ver references/manifests-notes.md).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # O Next grava cache de imagem e de fetch aqui. Com o root FS
            # somente leitura, sem este volume o servidor derruba a requisição
            # na primeira tentativa de escrita.
            - name: next-cache
              mountPath: /app/.next/cache
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
