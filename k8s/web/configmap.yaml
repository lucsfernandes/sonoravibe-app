apiVersion: v1
kind: ConfigMap
metadata:
  name: sonora-web-config
  namespace: sonora
  labels:
    app.kubernetes.io/name: sonora-web
    app.kubernetes.io/part-of: arcobatrox
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  TZ: "America/Sao_Paulo"
  # NEXT_PUBLIC_API_URL NÃO entra aqui: o Next fixa as variáveis NEXT_PUBLIC_*
  # no momento do BUILD, não no runtime. Colocá-la no ConfigMap não teria efeito
  # nenhum — ela é passada como --build-arg no workflow.
