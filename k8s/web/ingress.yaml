apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonora-web-ingress
  namespace: sonora
  labels:
    app.kubernetes.io/name: sonora-web
    app.kubernetes.io/part-of: arcobatrox
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # cert-manager emite o certificado sozinho e o grava no secret abaixo (spec.tls.secretName)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Redirect HTTP->HTTPS: só habilite depois de conferir se o Traefik já redireciona globalmente.
    # Se precisar, copie assets/optional/middlewares.yaml para k8s/ e descomente:
    # traefik.ingress.kubernetes.io/router.middlewares: sonora-redirect-to-https@kubernetescrd
spec:
  tls:
    # Um certificado cobrindo os dois nomes. O CORS da API já libera os dois,
    # e quem digita "www" é maioria em domínio de marca.
    - hosts:
        - sonoravibe.com
        - www.sonoravibe.com
      secretName: sonora-web-tls
  rules:
    - host: sonoravibe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonora-web
                port:
                  number: 80
    - host: www.sonoravibe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonora-web
                port:
                  number: 80
